---
configuration:
  connector:
    step_path: "com.freshworks.core.data.four_five_zero.durability.fb.steps"
    bean_path: "com.freshworks.core.data.four_five_zero.durability.fb.beans"
    asset_path: "com.freshworks.core.data.four_five_zero.durability.fb.assets"

  core:
    publisher:
      # default is NOP Persistent which does nothing
      #    driver: "com.freshworks.core.publisher.Noop"
      driver: "com.freshworks.core.publisher.MongoDb"
      thread_count: 100
      poll_count: 1000

    # Keep traverser thread count as 1.
    processor:
      poll_count: 1000
      number_of_parallel_processor : 20

    traverser:
      thread_count: 1
      type: "http"

    join:
      inner_join:
        driver: "com.freshworks.core.processor.joins.InnerJoinService"

      left_join:
        driver: "com.freshworks.core.processor.joins.LeftJoinService"

      noop_join:
        driver: "com.freshworks.core.processor.joins.NoopJoinService"


    infra:
      infra_type: "nitrite"
      nitrite_data_path: "/Users/aaggarwal/Documents/hagrid-releases/hagrid-oss/hagrid-oss/database"
      nitrite_database_type: "file"
      environment: "development"
      persistent:
        development:
          database:
            host: "localhost"
            port: "27017"
            username: "admin"
            password: "password12345"
            authDb: "admin"

        staging:
          database:
            host: "10.197.215.216"
            port: "27017"
            username: "admin"
            password: "password12345"
            authDb: "admin"

        production:
          database:
            host: "10.197.215.216"
