---
configuration:
  connector:
    step_path: "com.freshworks.core.data.four_zero_zero.concurrency.fb.steps"
    bean_path: "com.freshworks.core.data.four_zero_zero.concurrency.fb.beans"
    asset_path: "com.freshworks.core.data.four_zero_zero.concurrency.fb.assets"

  core:
    publisher:
      # default is NOP Persistent which does nothing
      #    driver: "com.freshworks.core.publisher.Noop"
      driver: "com.freshworks.core.publisher.MongoDb"
      thread_count: 100
      poll_count: 1000

    # Keep traverser thread count as 1.
    processor:
      poll_count: 1000
      number_of_parallel_processor : 20

    traverser:
      thread_count: 1
      type: "http"

    join:
      inner_join:
        driver: "com.freshworks.core.processor.joins.InnerJoinService"

      left_join:
        driver: "com.freshworks.core.processor.joins.LeftJoinService"

      noop_join:
        driver: "com.freshworks.core.processor.joins.NoopJoinService"


    infra:
      infra_type: "h2"
      h2_data_path: "/Users/aaggarwal/Documents/hagrid-releases/data/hagrid-4.0.0-alpha/database/concurrency-test-file"
#      h2_host_address: "localhost:9092"
      h2_database_type: "tcp"
      environment: "development"
      persistent:
        development:
          database:
            host: "mongodb"
            port: "27017"
            username: "admin"
            password: "password12345"
            authDb: "admin"

        staging:
          database:
            host: "mongodb"
            port: "27017"
            username: "admin"
            password: "password12345"
            authDb: "admin"

        production:
          database:
            host: "mongodb"
            port: "27017"
            username: "admin"
            password: "password12345"
            authDb: "admin"


      infra: "com.freshworks.core.shared.MongoDb.infra.MongoDbInfraService"
      queue_driver: "com.freshworks.core.infra.MongoDb.MongodbQueue"
      list_driver: "com.freshworks.core.infra.MongoDb.MongodbList"
      key_value_driver: "com.freshworks.core.infra.MongoDb.MongodbKeyValue"

    generation:
      strategy: "asap" # As of now, we support just asap strategy. There is no what-complete