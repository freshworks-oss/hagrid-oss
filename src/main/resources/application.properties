spring.application.name = hagrid
spring.threads.virtual.enabled=true
server.tomcat.threads.max=1000
server.port=8080


management.tracing.sampling.probability=1.0
management.tracing.propagation.type=b3
management.endpoints.web.exposure.include=*
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.mongo.command.enabled=false
management.metrics.mongo.connectionpool.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Hagrid infra layer: mongo | file (nitrite)
spring.connector.infra.type=mongo
spring.connector.infra.mongo.database.host=localhost
spring.connector.infra.mongo.database.port=27017
spring.connector.infra.mongo.database.user=admin
spring.connector.infra.mongo.database.password=password12345
spring.connector.infra.mongo.database.authDb=admin
