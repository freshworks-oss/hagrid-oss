site_name: Hagrid By Freshworks
site_dir: docs
docs_dir: wiki

theme:
  name: material
  font:
    text: Roboto
  custom_dir: wiki/custom_theme/
  favicon: assets/images/favicon.ico
  logo: assets/images/logo.png
  features:
    - navigation.tabs
    - search.suggest
    - search.highlight
    - search.share
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress

extra_javascript:
  - assets/javascript/github-issue.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - include-markdown
  - glightbox
  
nav:
  - "Home": index.md
  # - Get Started:
  #     - Basic Concepts: get_start/concepts.md
  #     - Development: get_start/develop.md

  # Below section, we explain advance concepts from user perspective
