      - Beans: usecases/beans.md
      - Assets: usecases/assets.md
      - Consumer: usecases/consumer.md
      - Error Handling: usecases/error_handling.md
      - Analytics: usecases/analytics.md
      - Performance: usecases/performance.md


  - Versions:
      - 4.0.0: versions/4.0.0.md
      - 3.7.0: versions/3.7.0.md
